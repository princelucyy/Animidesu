name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Generate platform project
        run: flutter create --platforms=android,web,windows,linux,macos .
- name: Remove generated sample test        run: rm -f test/widget_test.dart
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v5
        with:
          name: animidesu-apks
          path: build/app/outputs/flutter-apk/*.apk
